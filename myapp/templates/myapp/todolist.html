{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do App</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
</head>
<body>

<nav>
    <h2>My To-Do App</h2>
</nav>

<div class="container">
    <h1>My To-Do List</h1>

    <!-- Add Task Form -->
    <form method="POST" class="add-task-form">
        {% csrf_token %}
        {{ form.task }}
        <button type="submit">Add</button>
    </form>

    <!-- Task Table -->
    <table>
        <tr>
            <th>#</th>
            <th>Task</th>
            <th>Actions</th>
        </tr>
        {% for todo in todos %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td style="{% if todo.completed %}text-decoration: line-through; color: #aaa;{% endif %}">
                {{ todo.task }}
            </td>
            <td>
                <form method="POST" action="{% url 'toggle_task' todo.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-complete">
                        {% if todo.completed %}Undo{% else %}Complete{% endif %}
                    </button>
                </form>

                <form method="POST" action="{% url 'delete_task' todo.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" style="text-align:center;">No tasks yet!</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
